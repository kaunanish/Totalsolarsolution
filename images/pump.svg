<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE8FF"/>
      <stop offset="100%" stop-color="#F0FFF4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#sky3)"/>
  <circle cx="80" cy="70" r="34" fill="#FFC93C"/>
  <!-- field -->
  <rect x="0" y="360" width="600" height="60" fill="#9BD46B"/>
  <rect x="0" y="350" width="600" height="14" fill="#7FBE52"/>
  <!-- solar panel on stand -->
  <g transform="translate(70,190) rotate(-15)">
    <rect x="0" y="0" width="180" height="60" rx="4" fill="#123B7A" stroke="#0B2454" stroke-width="2"/>
    <line x1="45" y1="0" x2="45" y2="60" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="90" y1="0" x2="90" y2="60" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="135" y1="0" x2="135" y2="60" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <line x1="140" y1="255" x2="140" y2="355" stroke="#555" stroke-width="10"/>
  <line x1="90" y1="355" x2="190" y2="355" stroke="#555" stroke-width="10"/>
  <!-- pump unit -->
  <rect x="300" y="290" width="90" height="70" rx="8" fill="#0B3D91"/>
  <circle cx="345" cy="300" r="10" fill="#FFC93C"/>
  <rect x="320" y="360" width="10" height="30" fill="#555"/>
  <rect x="370" y="360" width="10" height="30" fill="#555"/>
  <!-- pipe -->
  <path d="M390 320 H 470 V 400" stroke="#7A7A7A" stroke-width="12" fill="none"/>
  <!-- water spray -->
  <path d="M470 400 C 460 380, 440 370, 420 380" stroke="#4FB3FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M470 400 C 480 375, 500 368, 515 380" stroke="#4FB3FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M470 400 C 470 375, 470 365, 470 355" stroke="#4FB3FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- crops -->
  <g stroke="#3E8E3E" stroke-width="5" stroke-linecap="round">
    <line x1="440" y1="360" x2="440" y2="335"/>
    <line x1="455" y1="360" x2="450" y2="330"/>
    <line x1="470" y1="360" x2="470" y2="328"/>
    <line x1="485" y1="360" x2="490" y2="332"/>
    <line x1="500" y1="360" x2="502" y2="335"/>
  </g>
  <!-- wire from panel to pump -->
  <path d="M140 260 C 200 300, 250 300, 300 310" stroke="#FF9D23" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
