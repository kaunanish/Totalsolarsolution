<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD3FF"/>
      <stop offset="100%" stop-color="#E9F7FF"/>
    </linearGradient>
    <linearGradient id="panelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123B7A"/>
      <stop offset="100%" stop-color="#0B2454"/>
    </linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D23"/>
      <stop offset="100%" stop-color="#E67E00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#sky)"/>
  <circle cx="500" cy="80" r="46" fill="#FFC93C"/>
  <g stroke="#FFC93C" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="500" y1="10" x2="500" y2="26"/>
    <line x1="500" y1="134" x2="500" y2="150"/>
    <line x1="430" y1="80" x2="446" y2="80"/>
    <line x1="554" y1="80" x2="570" y2="80"/>
  </g>
  <!-- house -->
  <rect x="90" y="260" width="300" height="140" fill="#F4F4F4"/>
  <polygon points="70,260 240,160 410,260" fill="url(#roofG)"/>
  <rect x="180" y="320" width="60" height="80" fill="#0B3D91"/>
  <rect x="290" y="300" width="50" height="45" fill="#8FD3FF" stroke="#0B3D91" stroke-width="4"/>
  <!-- solar panels on roof -->
  <g transform="translate(105,175) rotate(-20)">
    <rect x="0" y="0" width="220" height="70" rx="4" fill="url(#panelG)" stroke="#0B2454" stroke-width="2"/>
    <line x1="55" y1="0" x2="55" y2="70" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="110" y1="0" x2="110" y2="70" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="70" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="0" y1="35" x2="220" y2="35" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <!-- ground -->
  <rect x="0" y="400" width="600" height="20" fill="#BFE3B4"/>
  <!-- extra ground panel array -->
  <g transform="translate(420,340) rotate(-8)">
    <rect x="0" y="0" width="160" height="55" rx="4" fill="url(#panelG)" stroke="#0B2454" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="55" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="55" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="55" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="0" y1="27" x2="160" y2="27" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <line x1="450" y1="395" x2="450" y2="415" stroke="#6b4a2b" stroke-width="6"/>
  <line x1="540" y1="390" x2="540" y2="415" stroke="#6b4a2b" stroke-width="6"/>
</svg>
