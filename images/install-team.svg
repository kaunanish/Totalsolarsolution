<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEBFF"/>
      <stop offset="100%" stop-color="#EFFBFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#sky5)"/>
  <circle cx="520" cy="70" r="38" fill="#FFC93C"/>
  <rect x="0" y="390" width="600" height="30" fill="#D8CBB0"/>
  <!-- roof platform -->
  <polygon points="60,340 300,260 540,340 540,390 60,390" fill="#EDEDED" stroke="#CFCFCF" stroke-width="2"/>
  <!-- panels being installed -->
  <g transform="translate(140,230) rotate(-12)">
    <rect x="0" y="0" width="150" height="50" rx="4" fill="#123B7A" stroke="#0B2454" stroke-width="2"/>
    <line x1="37" y1="0" x2="37" y2="50" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="75" y1="0" x2="75" y2="50" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="112" y1="0" x2="112" y2="50" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <g transform="translate(320,230) rotate(-8)">
    <rect x="0" y="0" width="150" height="50" rx="4" fill="#123B7A" stroke="#0B2454" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- worker 1 -->
  <g transform="translate(210,255)">
    <circle cx="0" cy="0" r="14" fill="#F3B98B"/>
    <rect x="-16" y="10" width="32" height="18" rx="6" fill="#FF9D23"/>
    <rect x="-14" y="26" width="12" height="26" fill="#123B7A"/>
    <rect x="4" y="26" width="12" height="26" fill="#123B7A"/>
    <rect x="-22" y="-24" width="44" height="12" rx="6" fill="#0B3D91"/>
  </g>
  <!-- worker 2 -->
  <g transform="translate(370,250)">
    <circle cx="0" cy="0" r="14" fill="#C98456"/>
    <rect x="-16" y="10" width="32" height="18" rx="6" fill="#0B3D91"/>
    <rect x="-14" y="26" width="12" height="26" fill="#333"/>
    <rect x="4" y="26" width="12" height="26" fill="#333"/>
    <rect x="-22" y="-24" width="44" height="12" rx="6" fill="#FFC93C"/>
  </g>
  <!-- toolbox -->
  <rect x="440" y="330" width="40" height="26" rx="3" fill="#FF9D23"/>
  <rect x="452" y="322" width="16" height="10" fill="#FF9D23"/>
</svg>
