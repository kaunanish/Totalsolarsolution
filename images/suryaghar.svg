<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE3B0"/>
      <stop offset="100%" stop-color="#FFF6E8"/>
    </linearGradient>
    <linearGradient id="roofG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D64545"/>
      <stop offset="100%" stop-color="#B23333"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#sky4)"/>
  <rect x="0" y="380" width="600" height="40" fill="#EAD9B8"/>
  <!-- house -->
  <rect x="200" y="240" width="220" height="140" fill="#FFF8EC" stroke="#E0C79A" stroke-width="2"/>
  <polygon points="185,240 310,150 435,240" fill="url(#roofG2)"/>
  <rect x="280" y="300" width="50" height="80" fill="#8A5A2B"/>
  <rect x="360" y="280" width="40" height="40" fill="#BFE3FF" stroke="#0B3D91" stroke-width="3"/>
  <rect x="230" y="280" width="40" height="40" fill="#BFE3FF" stroke="#0B3D91" stroke-width="3"/>
  <!-- solar panels on roof -->
  <g transform="translate(215,168) rotate(-21)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#123B7A" stroke="#0B2454" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="55" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="55" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="55" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <!-- badge -->
  <circle cx="480" cy="110" r="62" fill="#0B3D91"/>
  <circle cx="480" cy="110" r="52" fill="#123B7A" stroke="#FFC93C" stroke-width="3"/>
  <text x="480" y="98" text-anchor="middle" font-family="Arial" font-weight="800" font-size="15" fill="#FFC93C">PM SURYA</text>
  <text x="480" y="118" text-anchor="middle" font-family="Arial" font-weight="800" font-size="15" fill="#FFC93C">GHAR</text>
  <text x="480" y="136" text-anchor="middle" font-family="Arial" font-weight="600" font-size="10" fill="#FFFFFF">YOJANA</text>
  <!-- rupee coin -->
  <circle cx="130" cy="120" r="30" fill="#FFC93C"/>
  <text x="130" y="130" text-anchor="middle" font-family="Arial" font-weight="800" font-size="26" fill="#7A4E00">₹</text>
</svg>
