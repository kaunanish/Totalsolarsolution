<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEBFF"/>
      <stop offset="100%" stop-color="#F5FAFF"/>
    </linearGradient>
    <linearGradient id="boxG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#bg2)"/>
  <rect x="0" y="380" width="600" height="40" fill="#D9D9D9"/>
  <!-- inverter box -->
  <rect x="220" y="110" width="160" height="240" rx="10" fill="url(#boxG)"/>
  <rect x="240" y="130" width="120" height="60" rx="6" fill="#0B3D91"/>
  <text x="300" y="165" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#FFC93C">TSS</text>
  <circle cx="250" cy="215" r="8" fill="#3CD070"/>
  <circle cx="280" cy="215" r="8" fill="#FFC93C"/>
  <rect x="240" y="240" width="120" height="14" rx="3" fill="#555"/>
  <rect x="240" y="264" width="120" height="14" rx="3" fill="#555"/>
  <rect x="240" y="288" width="120" height="14" rx="3" fill="#555"/>
  <rect x="260" y="320" width="80" height="18" rx="4" fill="#0B2454"/>
  <!-- cables -->
  <path d="M240 350 C 200 370, 150 360, 120 385" stroke="#FF9D23" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M360 350 C 400 370, 450 360, 480 385" stroke="#0B3D91" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- small panel icon left -->
  <g transform="translate(70,260) rotate(-6)">
    <rect x="0" y="0" width="110" height="45" rx="4" fill="#123B7A" stroke="#0B2454" stroke-width="2"/>
    <line x1="27" y1="0" x2="27" y2="45" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="54" y1="0" x2="54" y2="45" stroke="#3E6FC4" stroke-width="2"/>
    <line x1="81" y1="0" x2="81" y2="45" stroke="#3E6FC4" stroke-width="2"/>
  </g>
  <!-- bulb icon right showing power -->
  <circle cx="500" cy="270" r="26" fill="#FFC93C" opacity="0.9"/>
  <rect x="492" y="292" width="16" height="14" fill="#999"/>
</svg>
