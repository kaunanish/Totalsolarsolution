    <rect x="4" y="34" width="14" height="30" fill="#333"/>
    <rect x="-24" y="-26" width="48" height="12" rx="6" fill="#FFC93C"/>
    <rect x="14" y="6" width="30" height="8" rx="3" fill="#888" transform="rotate(30 14 6)"/>
  </g>
  <!-- toolbox -->
  <rect x="470" y="330" width="42" height="26" rx="3" fill="#FF9D23"/>
  <rect x="482" y="322" width="18" height="10" fill="#FF9D23"/>
