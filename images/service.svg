<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEFFF"/>
      <stop offset="100%" stop-color="#F0FFFB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#skyS)"/>
  <circle cx="90" cy="70" r="30" fill="#FFC93C"/>
  <rect x="0" y="370" width="600" height="50" fill="#DDEFE6"/>
  <!-- service van -->
  <rect x="120" y="250" width="220" height="90" rx="12" fill="#0B3D91"/>
  <rect x="120" y="250" width="90" height="90" rx="12" fill="#FF9D23"/>
  <rect x="150" y="270" width="45" height="35" rx="4" fill="#BFE3FF"/>
  <circle cx="175" cy="345" r="20" fill="#222"/>
  <circle cx="290" cy="345" r="20" fill="#222"/>
  <circle cx="175" cy="345" r="9" fill="#888"/>
  <circle cx="290" cy="345" r="9" fill="#888"/>
  <text x="270" y="300" text-anchor="middle" font-family="Arial" font-weight="800" font-size="18" fill="#FFC93C">TSS</text>
  <text x="270" y="318" text-anchor="middle" font-family="Arial" font-weight="600" font-size="9" fill="#FFFFFF">SERVICE</text>
  <!-- panel on roof of van -->
